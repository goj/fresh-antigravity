name: "Hourly Upstream Check & Bump"

on:
  schedule:
    # Run at minute 15 of every hour
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: false

      - name: Check for updates (fast exit)
        id: check
        run: |
          if go run ./cmd/update -check; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "==> All packages up to date. Exiting early."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "==> Upstream updates detected. Proceeding with update."
          fi

      - uses: cachix/install-nix-action@v25
        if: steps.check.outputs.has_updates == 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix (optional)
        uses: cachix/cachix-action@v15
        if: steps.check.outputs.has_updates == 'true' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ vars.CACHIX_NAME || 'goj' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Run updater
        if: steps.check.outputs.has_updates == 'true'
        run: nix run .#update

      - name: Verify build and cache packages
        if: steps.check.outputs.has_updates == 'true'
        run: |
          if [ -n "$(git status --porcelain sources.json)" ]; then
            echo "==> Building packages to verify and push to Cachix..."
            nix build .#antigravity-cli .#antigravity-hub .#antigravity-acp
          fi

      - name: Commit and push changes
        if: steps.check.outputs.has_updates == 'true'
        run: |
          if [ -n "$(git status --porcelain sources.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            CLI_VER=$(jq -r .cli.version sources.json)
            HUB_VER=$(jq -r .hub.version sources.json)
            ACP_VER=$(jq -r .acp.version sources.json)
            git add sources.json
            git commit -m "Bump Antigravity (CLI: ${CLI_VER}, Hub: ${HUB_VER}, ACP: ${ACP_VER})"
            git pull --rebase
            git push
          else
            echo "==> Working tree clean. No commit needed."
          fi
